name: CI

# Every input is pinned: actions by commit SHA, runner images by versioned
# label, Go by go.mod, age by module version. See docs/development/integrations.md.

# The test matrix runs only when Go code, the module files, the list of
# expected skips or this workflow change. Pushes trigger it on main only, so
# a branch with an open pull request runs once. workflow_dispatch runs it on
# any branch and ignores the path filter. The checks that cover every file,
# such as the key-material search, are in checks.yml.
on:
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
      - .github/expected-skips.txt
  pull_request:
    # Keep this list equal to the one under push.
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .github/workflows/ci.yml
      - .github/expected-skips.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Install age
        run: |
          go install filippo.io/age/cmd/age@v1.2.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          go version
          age --version

      - name: Vet
        run: go vet ./...

      - name: Test with skip report
        run: go test -count=1 -json ./... | go run ./internal/tools/skipreport

      - name: Test with race detector
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./...

